services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
       PORT: "5000"
       REDIS_URL: "redis://redis:6379"
       ENABLE_TURNSTILE: "false"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
    command: npx nodemon server.js
  redis: 
    image: redis:7-alpine
    ports: 
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data: